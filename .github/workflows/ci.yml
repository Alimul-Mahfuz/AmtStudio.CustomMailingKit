name: .NET CI & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AmtStudio.CustomMailingKit.slnx

    - name: Build
      run: dotnet build AmtStudio.CustomMailingKit.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test AmtStudio.CustomMailingKit.Tests\AmtStudio.CustomMailingKit.Tests.csproj --no-build --verbosity normal --configuration Release

    - name: Pack NuGet Package
      run: dotnet pack AmtStudio.CustomMailingKit\AmtStudio.CustomMailingKit.csproj -c Release -o ./artifacts
